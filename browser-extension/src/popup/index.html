<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Specialist Capture</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }
      body {
        width: 380px;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      button {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 4px;
        border: 1px solid #888;
        background: #f6f6f6;
        cursor: pointer;
      }
      button.primary {
        background: #2d7;
        color: #fff;
        border-color: #2d7;
      }
      button.danger {
        background: #d44;
        color: #fff;
        border-color: #d44;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      input[type="text"],
      textarea {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid #aaa;
      }
      textarea {
        resize: vertical;
        min-height: 56px;
      }
      .stats {
        font-size: 12px;
        color: #555;
      }
      .stats table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }
      .stats th,
      .stats td {
        text-align: left;
        padding: 2px 4px;
        border-bottom: 1px solid #eee;
      }
      .error {
        color: #c22;
        background: #fee;
        padding: 6px;
        border-radius: 4px;
      }
      .privacy {
        font-size: 11px;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.tsx"></script>
  </body>
</html>

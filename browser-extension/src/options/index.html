<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Specialist Capture — Options</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 24px auto;
        padding: 0 16px;
      }
      h1 { font-size: 20px; }
      label { display: block; margin: 12px 0; font-size: 13px; }
      input[type="text"], input[type="password"], input[type="number"], textarea, select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font: inherit;
        border-radius: 4px;
        border: 1px solid #aaa;
        margin-top: 4px;
      }
      textarea { min-height: 80px; }
      button {
        padding: 8px 14px;
        font-size: 13px;
        border-radius: 4px;
        background: #2d7;
        color: #fff;
        border: 1px solid #2d7;
        cursor: pointer;
      }
      .help { color: #777; font-size: 12px; }
      .saved { color: #2a7; font-size: 12px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./options.tsx"></script>
  </body>
</html>
